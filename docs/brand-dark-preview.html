<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>erdős · Dark portrait studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#16191e;color:#e3e4e8;font:15px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px}h1{font-size:25px;margin:0}p{max-width:760px;color:#b8bec8}h2{font-size:14px;font-weight:500;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.study{border:1px solid #3b414b;border-radius:12px;overflow:hidden}.specimen{background:var(--surface,#20242b);padding:20px;text-align:center}.clay{--surface:#2b2724}.identity{display:flex;flex-direction:column;align-items:center;gap:8px}.name{font:400 32px/1.2 Baskerville,'Times New Roman',serif}.portrait{width:120px;aspect-ratio:750/630;position:relative;overflow:hidden;isolation:isolate}.portrait img{position:absolute;max-width:none;width:167.2%;height:auto;left:-33.333333%;top:-46.031746%}.negative{background:var(--surface,#20242b)}.negative img{filter:grayscale(1) contrast(1.1) invert(1);mix-blend-mode:screen}.a{aspect-ratio:910/750}.a img{width:140.659%;left:-20.879%;top:-34.667%}.b{aspect-ratio:850/710}.b img{width:150.588%;left:-24.706%;top:-40.845%}.sizes{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:24px}.size52{width:52px}.size32{width:32px}.caption{font-size:12px;color:#aeb7c4;margin:8px 0 0}.note{padding:16px;margin:0;font-size:13px;background:#191c22}.light{--surface:#fffefa;color:#202632}.original{background:#fffefa}.original img{filter:grayscale(1) contrast(1.1);mix-blend-mode:multiply}a{color:#b0c4ff}footer{margin-top:24px}@media(max-width:650px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style>
<main><h1>erdős · Dark portrait studies</h1><p>Design experiments, not approved replacements. Compare the expression and balance at 120 px, then at the actual 52 px sidebar and 32 px mobile sizes.</p><div class="grid" id="studies"></div><footer><a href="./brand-preview.html">Current four-theme preview</a> · <a href="./">Course website</a></footer></main>
<script>
const studies=[
 {title:'Original drawing · light reference',style:'original',src:'erdos-proof-v13.png',tone:'light',note:'The approved v13 geometry is the reference. The original photograph remains the authority for likeness.'},
 {title:'Automatic reversal · rejected',style:'negative',src:'erdos-proof-v13.png',note:'Bright eyes and a bright mouth cavity invert the meaning of the original dark features.'},
 {title:'A · Larger facial planes',style:'a',src:'erdos-dark-study-a.png',note:'Rejected: too much filled nose and cheek area. Changes the visual character of the mark.'},
 {title:'B · Filled lens regions',style:'b',src:'erdos-dark-study-b.png',note:'Rejected: keeps dark eyelids, but broad lens fills can read as tinted glasses.'},
 {title:'C · Selective highlights',style:'b',src:'erdos-dark-study-c.png',note:'Owner liked the direction, but found the eyes too faint.'},
 {title:'Rejected · Pupil / sliver revision',style:'b',src:'erdos-dark-v2.png',note:'Owner rejected: one missing eye and a half-painted other eye. Contrast alone is not a successful eye shape.'},
 {title:'C revised · Original eyelid shapes',style:'b',src:'erdos-dark-v3.png',note:'Current local trial: both complete original eyelid silhouettes in muted ink. No invented pupil or eyeball fragments. Hover wink is available in the four-theme preview.'}
];
studies.splice(2, 0, studies.pop());
const portrait=(s,size='')=>`<span class="portrait ${s.style} ${size}" aria-hidden="true"><img src="./assets/brand/${s.src}" alt=""></span>`;
document.getElementById('studies').innerHTML=studies.map(s=>`<article class="study"><div class="specimen ${s.tone||''}"><h2>${s.title}</h2><div class="identity">${portrait(s)}<span class="name" lang="hu">erdős</span></div><div class="sizes">${portrait(s,'size52')}${portrait(s,'size32')}</div><p class="caption">52 px / 32 px</p></div>${s.tone?'':`<div class="specimen clay"><div class="sizes">${portrait(s,'size52')}${portrait(s,'size32')}</div><p class="caption">Warm dark surface</p></div>`}<p class="note">${s.note}</p></article>`).join('');
</script></html>
