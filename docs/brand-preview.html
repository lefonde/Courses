</main><script>
document.getElementById('play-wink').addEventListener('click',()=>{
 document.getElementById('wink-pose').checked=false;
 document.body.classList.remove('wink-pose','wink-replay');
 void document.body.offsetWidth;
 document.body.classList.add('wink-replay');
});
document.getElementById('wink-pose').addEventListener('change',event=>{
 document.body.classList.remove('wink-replay');
 document.body.classList.toggle('wink-pose',event.target.checked);
});
</script></body></html>
