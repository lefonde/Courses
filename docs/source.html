<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>חומרי הקורס · מצפן</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./source-library.js" defer></script>
  <script src="./source-viewer.js" defer></script>
  <style>
    body{min-height:100dvh;display:flex;flex-direction:column}.source-top{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel)}.source-top>div{flex:1;min-width:200px}.source-top h1{font-size:18px;letter-spacing:0;line-height:1.5}.source-top p{font-size:12px;color:var(--muted);margin-top:5px}.source-view{padding:0;max-width:none;margin:0;min-height:0;flex:1;display:flex;flex-direction:column}.source-message{width:min(680px,calc(100% - 36px));margin:48px auto;padding:26px}.source-message h2{margin-bottom:15px}.source-message p{color:var(--muted);margin-top:10px}.source-message .button{margin-top:20px}.source-message bdi{overflow-wrap:anywhere}.source-pdf{display:block;width:100%;flex:1;border:0;min-height:calc(100dvh - 105px);background:#292929}.source-actions{display:flex;gap:8px;flex-wrap:wrap}.source-top .text-link{font-size:13px}@media(max-width:700px){.source-top{padding:14px 16px}.source-top>div{min-width:calc(100% - 100px)}.source-message{margin:25px auto;padding:20px}.source-pdf{min-height:calc(100dvh - 170px)}}
  </style>
</head>
<body>
  <header class="source-top">
    <a class="text-link" href="./#library">← חזרה למקורות</a>
    <div><h1 id="source-title">פתיחת קובץ הקורס…</h1><p id="source-detail">הקובץ ייפתח מהעותק שנשמר בדפדפן הזה.</p></div>
    <nav id="source-actions" class="source-actions" aria-label="פעולות לקובץ"></nav>
  </header>
  <main id="source-view" class="source-view" aria-live="polite">
    <div class="source-message panel"><p>בודקים אם הקובץ זמין בדפדפן…</p></div>
  </main>
</body>
</html>
